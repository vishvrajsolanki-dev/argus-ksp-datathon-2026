services:
  - type: web
    name: argus-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: argus-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PYTHONPATH
        value: /app
    healthCheckPath: /health

  - type: web
    name: argus-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend

databases:
  - name: argus-db
    plan: free
